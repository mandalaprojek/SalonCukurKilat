                  <div className="text-[10px] text-emerald-400 font-bold uppercase">Panel Kapster</div>
                  <h1 className="text-base font-bold text-white">{currentBarber.nama}</h1>
                  <div className="text-xs text-slate-300">Komisi: {currentBarber.persentaseKomisi}%</div>
                </div>
                <button
                  onClick={() => setIsUploadOpen(true)}
                  className="px-3 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs"
                >
                  📷 Unggah Potongan
                </button>
              </div>
              <div className="grid grid-cols-2 gap-2 pt-2 border-t border-white/10">
                <div className="bg-black/30 rounded-xl p-2.5">
                  <div className="text-[10px] text-slate-400">Komisi Saya</div>
                  <div className="text-base font-bold text-[#e5a93c] font-mono">{formatRupiah(myKomisi)}</div>
                </div>
                <div className="bg-black/30 rounded-xl p-2.5">
                  <div className="text-[10px] text-slate-400">Antrean Jadwal</div>
                  <div className="text-base font-bold text-white font-mono">{myBookings.length} Sesi</div>
                </div>
              </div>
            </div>

            <div className="space-y-2.5">
              <h2 className="text-sm font-bold text-white">📅 Jadwal Cukur Saya</h2>
              {myBookings.map((b) => (
                <div key={b.id} className="bg-[#0b322c] border border-white/10 rounded-xl p-3.5 space-y-2">
                  <div className="flex justify-between">
                    <div>
                      <span className="font-bold text-sm text-white">{b.pelangganNama}</span>
                      <span className="ml-2 text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold">
                        {b.status}
                      </span>
                      <div className="text-xs text-[#e5a93c]">{b.layananNama} ({b.jenisLayanan})</div>
                      <div className="text-[11px] text-slate-400">🕒 {b.jam} · {b.tanggal}</div>
                    </div>
                    <div className="text-right font-mono text-xs font-bold text-[#e5a93c]">
                      {formatRupiah(b.biaya)}
                    </div>
                  </div>
                  {b.alamatHomeService && (
                    <div className="text-[11px] text-amber-200 bg-black/30 p-2 rounded-lg">
                      📍 {b.alamatHomeService}
                    </div>
                  )}
                  {b.status !== 'Selesai' && (
                    <div className="flex justify-end gap-2 pt-2 border-t border-white/10">
                      {b.status === 'Menunggu' && (
                        <button
                          onClick={() => updateBookingStatus(b.id, 'Dikonfirmasi')}
                          className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold"
                        >
                          Konfirmasi
                        </button>
                      )}
                      <button
                        onClick={() => handleOpenPay(b)}
                        className="px-3 py-1.5 rounded-lg bg-[#e5a93c] text-[#062320] text-xs font-bold"
                      >
                        Selesaikan & Bayar
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {isUploadOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    onAddRiwayatPotong({
                      pelangganId: 'CUST-001',
                      pelangganNama: uploadCustName,
                      barberId: currentBarber.id,
                      barberNama: currentBarber.nickname,
                      tanggal: new Date().toISOString().slice(0, 10),
                      modelPotongan: uploadModel,
                      catatanGaya: uploadNotes,
                      fotoUrl: uploadBase64 || 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=500&q=80',
                      base64Photo: uploadBase64,
                      rating: 5,
                      review: 'Potongan presisi oleh ' + currentBarber.nickname,
                      tampilkanDiGaleri: true,
                    });
                    setIsUploadOpen(false);
                    setUploadCustName('');
                    setUploadModel('');
                    setUploadNotes('');
                  }}
                  className="w-full max-w-sm bg-[#0b322c] border border-white/20 rounded-2xl p-5 space-y-3"
                >
                  <h3 className="font-bold text-sm text-white">Unggah Hasil Potongan ke Drive</h3>
                  <input
                    type="text"
                    required
                    value={uploadCustName}
                    onChange={(e) => setUploadCustName(e.target.value)}
                    placeholder="Nama Pelanggan"
                    className="w-full bg-[#062320] border border-white/10 rounded-lg p-2 text-xs text-white"
                  />
                  <input
                    type="text"
                    required
                    value={uploadModel}
                    onChange={(e) => setUploadModel(e.target.value)}
                    placeholder="Model Potongan (Misal: Low Fade)"
                    className="w-full bg-[#062320] border border-white/10 rounded-lg p-2 text-xs text-white"
                  />
                  <textarea
                    rows={2}
                    value={uploadNotes}
                    onChange={(e) => setUploadNotes(e.target.value)}
                    placeholder="Catatan nomor pisau clipper & gaya..."
                    className="w-full bg-[#062320] border border-white/10 rounded-lg p-2 text-xs text-white"
                  />
                  <input
                    type="file"
                    accept="image/*"
                    onChange={async (e) => {
                      const f = e.target.files?.[0];
                      if (f) {
                        const b64 = await fileToBase64(f);
                        setUploadBase64(b64);
                      }
                    }}
                    className="text-xs w-full"
                  />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setIsUploadOpen(false)} className="flex-1 py-2 rounded-xl bg-white/10 text-xs">
                      Batal
                    </button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-[#e5a93c] text-[#062320] font-bold text-xs">
                      Simpan ke Drive
                    </button>
                  </div>
                </form>
              </div>
            )}

            {payingBookingId && (
              <PayModal
                amount={payAmount}
                method={payMethod}
                note={payNote}
                lastReceiptUrl={lastReceiptUrl}
                onMethodChange={setPayMethod}
                onAmountChange={setPayAmount}
                onNoteChange={setPayNote}
                onSubmit={handleConfirmPay}
                onClose={() => setPayingBookingId(null)}
              />
            )}
          </div>
        );
      }

      // MODE 2: PELANGGAN / FORM KARIR BARBER
      if (currentRole === 'customer') {
        return (
          <div className="space-y-5">
            <h1 className="text-xl font-bold text-white">💈 Rekrutmen Barber Baru</h1>
            <div className="bg-[#0b322c] border border-white/10 rounded-2xl p-4 space-y-3">
              {appSent ? (
                <div className="text-center space-y-2 py-4">
                  <div className="text-3xl">✅</div>
                  <h3 className="font-bold text-sm text-white">Lamaran Berhasil Terkirim ke Google Sheets & Drive!</h3>
                  <button onClick={() => setAppSent(false)} className="px-4 py-2 rounded-lg bg-white/10 text-xs">
                    Kirim Lamaran Lain
                  </button>
                </div>
              ) : (
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    onSubmitJobApplication({
                      nama: appNama,
                      noWa: appWa,
                      alamat: appAlamat,
                      pengalamanTahun: appExp,
                      spesialisasi: appSpecialty || 'Fade & Grooming',
                      ktpFileName: ktpName,
                      kkFileName: kkName,
                      ktpBase64,
                      kkBase64,
                    });
                    setAppSent(true);
                  }}
                  className="space-y-3"
                >
                  <input
                    type="text"
                    required
                    value={appNama}
                    onChange={(e) => setAppNama(e.target.value)}
                    placeholder="Nama Lengkap Calon Kapster"
                    className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-white"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="tel"
                      required
                      value={appWa}
                      onChange={(e) => setAppWa(e.target.value)}
                      placeholder="No. WhatsApp"
                      className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-white"
                    />
                    <input
                      type="number"
                      value={appExp}
                      onChange={(e) => setAppExp(Number(e.target.value))}
                      placeholder="Pengalaman (Thn)"
                      className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-white"
                    />
                  </div>
                  <input
                    type="text"
                    value={appAlamat}
                    onChange={(e) => setAppAlamat(e.target.value)}
                    placeholder="Alamat Domisili"
                    className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-white"
                  />
                  <input
                    type="text"
                    value={appSpecialty}
                    onChange={(e) => setAppSpecialty(e.target.value)}
                    placeholder="Spesialisasi Potongan (Fade, Razor, dll)"
                    className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-white"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <div className="border border-dashed border-white/20 rounded-xl p-2.5 text-center">
                      <span className="text-[10px] font-bold block text-[#e5a93c]">Unggah KTP</span>
                      <input
                        type="file"
                        accept=".pdf,image/*"
                        onChange={async (e) => {
                          const f = e.target.files?.[0];
                          if (f) {
                            setKtpName(f.name);
                            setKtpBase64(await fileToBase64(f));
                          }
                        }}
                        className="mt-1 text-[9px] w-full"
                      />
                    </div>
                    <div className="border border-dashed border-white/20 rounded-xl p-2.5 text-center">
                      <span className="text-[10px] font-bold block text-[#e5a93c]">Unggah KK</span>
                      <input
                        type="file"
                        accept=".pdf,image/*"
                        onChange={async (e) => {
                          const f = e.target.files?.[0];
                          if (f) {
                            setKkName(f.name);
                            setKkBase64(await fileToBase64(f));
                          }
                        }}
                        className="mt-1 text-[9px] w-full"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl bg-[#e5a93c] text-[#062320] font-bold text-xs">
                    Kirim Berkas Lamaran
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // MODE 3: OWNER / SUPERADMIN
      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <h1 className="text-lg font-bold text-white">🛡️ Dashboard Pemilik</h1>
            <button
              onClick={onRefreshSheets}
              className="px-2.5 py-1 rounded-lg bg-white/10 text-[#e5a93c] text-[11px] font-semibold"
            >
              ↻ Segarkan Data
            </button>
          </div>

          <div className="flex gap-1.5 p-1 bg-[#0b322c] rounded-xl border border-white/10 overflow-x-auto">
            {[
              { id: 'keuangan', label: 'Keuangan' },
              { id: 'jadwal', label: `Jadwal (${bookings.length})` },
              { id: 'stok', label: 'Stok Produk' },
              { id: 'pelamar', label: `Pelamar (${pendaftaran.length})` },
              { id: 'loyalty', label: 'Pengaturan' },
            ].map((t) => (
              <button
                key={t.id}
                onClick={() => setAdminTab(t.id)}
                className={`px-3 py-2 text-xs font-semibold rounded-lg whitespace-nowrap ${
                  adminTab === t.id ? 'bg-[#e5a93c] text-[#062320]' : 'text-slate-300'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {adminTab === 'keuangan' && (
            <div className="space-y-4">
              <div className="grid grid-cols-3 gap-2">
                <div className="bg-[#0b322c] border border-white/10 rounded-xl p-3">
                  <div className="text-[10px] text-slate-400">Total Omset</div>
                  <div className="text-xs font-bold text-[#e5a93c] font-mono mt-0.5">{formatRupiah(totalOmset)}</div>
                </div>
                <div className="bg-[#0b322c] border border-white/10 rounded-xl p-3">
                  <div className="text-[10px] text-slate-400">Komisi Barber</div>
                  <div className="text-xs font-bold text-emerald-400 font-mono mt-0.5">{formatRupiah(totalKomisiAll)}</div>
                </div>
                <div className="bg-[#0b322c] border border-white/10 rounded-xl p-3">
                  <div className="text-[10px] text-slate-400">Net Salon</div>
                  <div className="text-xs font-bold text-white font-mono mt-0.5">{formatRupiah(totalNetSalon)}</div>
                </div>
              </div>

              <div className="bg-[#0b322c] border border-white/10 rounded-2xl p-4 space-y-2.5">
                <h2 className="text-xs font-bold text-white">Rekap Komisi per Barber</h2>
                {barbers.map((b) => {
                  const bp = pembayaran.filter((p) => p.barberId === b.id);
                  const kom = bp.reduce((acc, p) => acc + (Number(p.komisiBarber) || 0), 0);
                  return (
                    <div key={b.id} className="p-2.5 bg-black/20 rounded-xl flex justify-between items-center text-xs">
                      <div>
                        <div className="font-bold text-white">{b.nama}</div>
                        <div className="text-[10px] text-slate-400">Komisi {b.persentaseKomisi}% · {bp.length} transaksi</div>
                      </div>
                      <div className="font-bold text-[#e5a93c] font-mono">{formatRupiah(kom)}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {adminTab === 'jadwal' && (
            <div className="space-y-2.5">
              {bookings.map((b) => (
                <div key={b.id} className="bg-[#0b322c] border border-white/10 rounded-xl p-3.5 space-y-2">
                  <div className="flex justify-between">
                    <div>
                      <span className="font-bold text-sm text-white">{b.pelangganNama}</span>
                      <span className="ml-2 text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold">
                        {b.status}
                      </span>
                      <div className="text-xs text-[#e5a93c]">{b.layananNama} · {b.jenisLayanan}</div>
                      <div className="text-[11px] text-slate-400">{b.kapsterNama} · {b.tanggal} {b.jam}</div>
                    </div>
                    <div className="text-right font-mono text-xs font-bold text-[#e5a93c]">{formatRupiah(b.biaya)}</div>
                  </div>
                  <div className="pt-2 border-t border-white/10 flex justify-between items-center">
                    <select
                      value={b.status}
                      onChange={(e) => updateBookingStatus(b.id, e.target.value)}
                      className="bg-[#062320] border border-white/10 rounded px-2 py-1 text-xs text-white"
                    >
                      <option value="Menunggu">Menunggu</option>
                      <option value="Dikonfirmasi">Dikonfirmasi</option>
                      <option value="Selesai">Selesai</option>
                      <option value="Batal">Batal</option>
                    </select>
                    {b.status !== 'Selesai' && (
                      <button
                        onClick={() => handleOpenPay(b)}
                        className="px-3 py-1.5 rounded-lg bg-[#e5a93c] text-[#062320] font-bold text-xs"
                      >
                        Bayar & Struk WA
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {adminTab === 'stok' && (
            <div className="space-y-2.5">
              {stok.map((item) => {
                const isLow = item.stokSaatIni <= item.minimumStok;
                return (
                  <div key={item.id} className={`p-3.5 rounded-xl border bg-[#0b322c] flex justify-between items-center ${isLow ? 'border-amber-500/50' : 'border-white/10'}`}>
                    <div>
                      <div className="text-xs font-bold text-white">
                        {item.namaProduk}
                        {isLow && <span className="ml-1.5 bg-rose-500/20 text-rose-400 text-[9px] px-1.5 py-0.5 rounded">MENIPIS</span>}
                      </div>
                      <div className="text-[10px] text-slate-400">Min: {item.minimumStok} {item.satuan} · {formatRupiah(item.harga)}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => onUpdateStock(item.id, -1)} className="w-7 h-7 rounded bg-white/10 text-xs font-bold">-</button>
                      <span className="font-mono font-bold text-sm w-6 text-center">{item.stokSaatIni}</span>
                      <button onClick={() => onUpdateStock(item.id, 1)} className="w-7 h-7 rounded bg-emerald-500/20 text-emerald-400 text-xs font-bold">+</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {adminTab === 'pelamar' && (
            <div className="space-y-2.5">
              {pendaftaran.map((p) => (
                <div key={p.id} className="bg-[#0b322c] border border-white/10 rounded-xl p-3.5 space-y-2">
                  <div className="flex justify-between">
                    <div>
                      <span className="font-bold text-xs text-white">{p.nama}</span>
                      <span className="ml-2 text-[9px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold">{p.statusLamaran}</span>
                      <div className="text-[11px] text-slate-300">WA: {p.noWa} · Pengalaman {p.pengalamanTahun} Thn</div>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-white/10">
                    <button onClick={() => onUpdateApplicantStatus(p.id, 'Ditolak')} className="px-2.5 py-1 rounded bg-rose-500/20 text-rose-400 text-xs font-semibold">Tolak</button>
                    <button onClick={() => onUpdateApplicantStatus(p.id, 'Diterima')} className="px-3 py-1 rounded bg-emerald-600 text-white text-xs font-bold">Terima Jadi Barber</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {adminTab === 'loyalty' && (
            <div className="space-y-4">
              <div className="bg-[#0b322c] border border-white/10 rounded-2xl p-4 space-y-3">
                <h2 className="text-xs font-bold text-white">Target Kunjungan Potong Gratis</h2>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    value={loyaltyVisitsInput}
                    onChange={(e) => setLoyaltyVisitsInput(Number(e.target.value))}
                    className="w-24 bg-[#062320] border border-white/10 rounded-lg p-2 text-xs text-[#e5a93c] font-bold font-mono"
                  />
                  <button
                    onClick={() => {
                      onUpdateLoyalty({ ...loyaltySettings, jumlahKunjunganReward: loyaltyVisitsInput });
                      setSavedToast(true);
                      setTimeout(() => setSavedToast(false), 2000);
                    }}
                    className="px-4 py-2 rounded-lg bg-[#e5a93c] text-[#062320] font-bold text-xs"
                  >
                    {savedToast ? 'Tersimpan!' : 'Simpan Aturan'}
                  </button>
                </div>
              </div>

              <div className="bg-[#0b322c] border border-white/10 rounded-2xl p-4 space-y-2">
                <h2 className="text-xs font-bold text-white">Kontrol Galeri Depan</h2>
                {riwayatPotong.map((r) => (
                  <div key={r.id} className="p-2 bg-black/20 rounded-lg flex justify-between items-center text-xs">
                    <span>{r.modelPotongan} ({r.pelangganNama})</span>
                    <button
                      onClick={() => onToggleGaleri(r.id)}
                      className={`px-2 py-1 rounded text-[10px] font-bold ${
                        r.tampilkanDiGaleri ? 'bg-emerald-500/20 text-emerald-400' : 'bg-white/10 text-slate-400'
                      }`}
                    >
                      {r.tampilkanDiGaleri ? 'Tampil' : 'Sembunyi'}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {payingBookingId && (
            <PayModal
              amount={payAmount}
              method={payMethod}
              note={payNote}
              lastReceiptUrl={lastReceiptUrl}
              onMethodChange={setPayMethod}
              onAmountChange={setPayAmount}
              onNoteChange={setPayNote}
              onSubmit={handleConfirmPay}
              onClose={() => setPayingBookingId(null)}
            />
          )}
        </div>
      );
    }

    function PayModal({ amount, method, note, lastReceiptUrl, onMethodChange, onAmountChange, onNoteChange, onSubmit, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
          <div className="w-full max-w-sm bg-[#0b322c] border border-white/20 rounded-2xl p-5 space-y-4">
            <div className="flex justify-between items-center border-b border-white/10 pb-2">
              <h3 className="font-bold text-sm text-white">Catat Pembayaran & Struk WA</h3>
              <button onClick={onClose} className="text-xs text-slate-400">Tutup</button>
            </div>
            {lastReceiptUrl ? (
              <div className="text-center space-y-3 py-2">
                <div className="text-3xl">✅</div>
                <div className="font-bold text-sm text-white">Pembayaran Lunas & Komisi Dicatat!</div>
                <a
                  href={lastReceiptUrl}
                  target="_blank"
                  rel="noreferrer"
                  className="block w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-xs"
                >
                  📲 Kirim Struk Digital via WhatsApp (wa.me)
                </a>
                <button onClick={onClose} className="w-full py-2 rounded-xl bg-white/10 text-xs">Selesai</button>
              </div>
            ) : (
              <form onSubmit={onSubmit} className="space-y-3">
                <div className="grid grid-cols-3 gap-2">
                  {['QRIS', 'Cash', 'Transfer'].map((m) => (
                    <button
                      key={m}
                      type="button"
                      onClick={() => onMethodChange(m)}
                      className={`py-2 rounded-lg text-xs font-bold border ${
                        method === m ? 'bg-[#e5a93c] text-[#062320] border-[#e5a93c]' : 'bg-white/5 border-white/10 text-slate-300'
                      }`}
                    >
                      {m}
                    </button>
                  ))}
                </div>
                <input
                  type="number"
                  required
                  value={amount}
                  onChange={(e) => onAmountChange(Number(e.target.value))}
                  className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-[#e5a93c] font-bold font-mono"
                />
                <input
                  type="text"
                  value={note}
                  onChange={(e) => onNoteChange(e.target.value)}
                  placeholder="Catatan Struk"
                  className="w-full bg-[#062320] border border-white/10 rounded-lg p-2.5 text-xs text-white"
                />
                <button type="submit" className="w-full py-3 rounded-xl bg-[#e5a93c] text-[#062320] font-bold text-xs">
                  Simpan & Buat Struk WA
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator && !window.google?.script?.run) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
