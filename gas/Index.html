    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(Number(amount) || 0);
    }

    function formatTanggalIndonesia(dateStr) {
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('id-ID', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          year: 'numeric',
        });
      } catch (e) {
        return dateStr;
      }
    }

    function generateWhatsAppReceiptUrl(options) {
      const cleanPhone = String(options.phone || '').replace(/[^0-9]/g, '');
      const targetPhone = cleanPhone.startsWith('0') ? '62' + cleanPhone.slice(1) : cleanPhone;
      const visitsLeft = Math.max(0, options.loyaltyTarget - options.loyaltyVisits);
      const loyaltyStatus =
        visitsLeft === 0
          ? '🎉 SELAMAT! Kupon Potong Rambut GRATIS Anda sudah terbuka!'
          : `⭐ Kunjungan ke-${options.loyaltyVisits}/${options.loyaltyTarget} (${visitsLeft}x potong lagi menuju CUKUR GRATIS)`;

      const message = `💈 *SALON CUKUR KILAT - STRUK DIGITAL RESMI* 💈
----------------------------------------
No. Transaksi : *${options.trxId}*
Pelanggan     : *${options.customerName}*
Barber        : *${options.barberName}*
Layanan       : *${options.serviceName}* (${options.serviceType})
Total Biaya   : *${formatRupiah(options.nominal)}*
Status Bayar  : *LUNAS (${options.paymentMethod})*
----------------------------------------
✂️ *Catatan Gaya*:
${options.haircutNotes || 'Fade presisi + grooming premium'}

🎯 *Program Loyalitas*:
${loyaltyStatus}

Terima kasih atas kunjungan Anda! Kami siap melayani ketampanan maksimal Anda kembali.
_SalonCukurKilat — Studio & Home Service_`;

      return `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    }

      const [stok, setStok] = useState(INITIAL_STOK);
      const [pendaftaran, setPendaftaran] = useState(INITIAL_PENDAFTARAN);
      const [loyaltySettings, setLoyaltySettings] = useState(INITIAL_LOYALTY_SETTINGS);

      // Preselected Booking State
      const [preselectedServiceId, setPreselectedServiceId] = useState('srv-1');
      const [preselectedServiceType, setPreselectedServiceType] = useState('Studio');

      const GAS_WEB_APP_URL =
        'https://script.google.com/macros/s/AKfycbwRaYx4eaGcI_4e4pDj_lYxQQJmwTNL82ia7xyrq-xxfDTnnqe_dLWNBr6aY7WI5-DXRg/exec';

      const applyRemoteData = useCallback((res) => {
        if (res && typeof res === 'object') {
          if (Array.isArray(res.customers) && res.customers.length > 0) setCustomers(res.customers);
          if (Array.isArray(res.barbers) && res.barbers.length > 0) setBarbers(res.barbers);
          if (Array.isArray(res.bookings)) setBookings(res.bookings);
          if (Array.isArray(res.riwayatPotong)) setRiwayatPotong(res.riwayatPotong);
          if (Array.isArray(res.pembayaran)) setPembayaran(res.pembayaran);
          if (Array.isArray(res.stok) && res.stok.length > 0) setStok(res.stok);
          if (Array.isArray(res.pendaftaran)) setPendaftaran(res.pendaftaran);
          if (res.loyaltySettings) setLoyaltySettings(res.loyaltySettings);
          setGasSyncStatus('connected');
        }
      }, []);

      // Load Data Awal dari Google Sheets (mendukung google.script.run & REST fetch GitHub)
      const loadFromGoogleSheets = useCallback(async () => {
        if (window.google && window.google.script && window.google.script.run) {
          setGasSyncStatus('syncing');
          window.google.script.run
            .withSuccessHandler((res) => applyRemoteData(res))
            .withFailureHandler(() => setGasSyncStatus('error'))
            .gasGetInitialData();
          return;
        }

        if (GAS_WEB_APP_URL) {
          try {
            setGasSyncStatus('syncing');
            const response = await fetch(`${GAS_WEB_APP_URL}?action=getAllData`, {
              method: 'GET',
              redirect: 'follow',
            });
            if (response.ok) {
              const data = await response.json();
              applyRemoteData(data);
            } else {
              setGasSyncStatus('error');
            }
          } catch (e) {
            setGasSyncStatus('local');
          }
        }
      }, [applyRemoteData]);

      useEffect(() => {
        loadFromGoogleSheets();
      }, [loadFromGoogleSheets]);

      // Kirim perubahan ke Code.gs di latar belakang (mendukung google.script.run & REST fetch GitHub)
      const dispatchToGas = async (action, payload) => {
        if (window.google && window.google.script && window.google.script.run) {
          setGasSyncStatus('syncing');
          window.google.script.run
            .withSuccessHandler(() => setGasSyncStatus('connected'))
            .withFailureHandler(() => setGasSyncStatus('error'))
            .gasDispatchAction(action, payload);
          return;
        }

        if (GAS_WEB_APP_URL) {
          try {
            setGasSyncStatus('syncing');
            const res = await fetch(GAS_WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, payload }),
              redirect: 'follow',
            });
            if (res.ok) setGasSyncStatus('connected');
          } catch (e) {
            setGasSyncStatus('error');
          }
        }
      };

      const activeCustomer = customers.find((c) => c.id === activeCustomerId) || customers[0];

      // Handler: Buat Booking Baru (Anti-Bentrok)
      const createBooking = (bookingData) => {
        const isConflict = bookings.some(
          (b) =>
            b.kapsterId === bookingData.kapsterId &&
            b.tanggal === bookingData.tanggal &&
            b.jam === bookingData.jam &&
            b.status !== 'Batal'
        );

        if (isConflict) {
          return {
            success: false,
            message: `Waduh! Slot jam ${bookingData.jam} bersama ${bookingData.kapsterNama} pada tanggal ini sudah terisi. Silakan pilih jam lain.`,
          };
        }

        const newId = `BKG-${Date.now().toString().slice(-4)}`;
        const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 16);
        const newBookingItem = {
          ...bookingData,
          id: newId,
          status: 'Menunggu',
          createdAt: nowStr,
        };

        setBookings((prev) => [newBookingItem, ...prev]);
        dispatchToGas('createBooking', bookingData);

        return {
          success: true,
          message: 'Booking berhasil dicatat ke Google Sheets!',
          bookingId: newId,
        };
      };

      // Handler: Ubah Status Booking
      const updateBookingStatus = (id, status) => {
        setBookings((prev) => prev.map((b) => (b.id === id ? { ...b, status } : b)));
        dispatchToGas('updateBookingStatus', { id, status });
      };

      // Handler: Proses Pembayaran & Hitung Komisi Barber Otomatis
      const processPayment = (bookingId, metode, nominal, catatan) => {
        const booking = bookings.find((b) => b.id === bookingId);
        if (!booking) return { success: false, trxId: '', komisi: 0, updatedVisits: 1 };

        const barber = barbers.find((b) => b.id === booking.kapsterId);
        const commissionRate = barber ? barber.persentaseKomisi : 40;
        const komisi = Math.round(nominal * (commissionRate / 100));
        const trxId = `TRX-${Date.now().toString().slice(-4)}`;
        const noReferensi = `${metode.toUpperCase()}-${Math.floor(100000 + Math.random() * 900000)}`;
        const adminName = currentRole === 'admin' ? 'Admin (Pemilik)' : booking.kapsterNama;

        const newTrx = {
          id: trxId,
          bookingId,
          pelangganNama: booking.pelangganNama,
          barberId: booking.kapsterId,
          barberNama: booking.kapsterNama,
          tanggal: new Date().toISOString().replace('T', ' ').slice(0, 16),
          metodeBayar: metode,
          nominal: Number(nominal),
          status: 'Lunas',
          noReferensi,
          catatan: catatan || 'Pembayaran layanan SalonCukurKilat',
          persentaseKomisi: commissionRate,
          komisiBarber: komisi,
          adminPencatat: adminName,
        };

        setPembayaran((prev) => [newTrx, ...prev]);
        setBookings((prev) => prev.map((b) => (b.id === bookingId ? { ...b, status: 'Selesai' } : b)));

        const matchedCust = customers.find(
          (c) => c.noWa === booking.pelangganWa || c.id === booking.pelangganId
        );
        const updatedVisits = (matchedCust ? matchedCust.totalKunjungan : 0) + 1;

        setCustomers((prev) =>
          prev.map((c) =>
            c.noWa === booking.pelangganWa || c.id === booking.pelangganId
              ? { ...c, totalKunjungan: updatedVisits, poinTerkumpul: updatedVisits }
              : c
          )
        );

        dispatchToGas('processPayment', {
          bookingId,
          pelangganNama: booking.pelangganNama,
          barberId: booking.kapsterId,
          barberNama: booking.kapsterNama,
          metodeBayar: metode,
          nominal: Number(nominal),
          noReferensi,
          catatan: catatan || 'Pembayaran layanan SalonCukurKilat',
          adminPencatat: adminName,
        });

        return { success: true, trxId, komisi, updatedVisits };
      };

      // =======================================================================
      // VIEW LOGIN
      // =======================================================================
      if (!isLoggedIn) {
        return (
          <LoginScreen
            customers={customers}
            barbers={barbers}
            onLoginCustomer={(nama, wa, custId) => {
              if (custId) {
                setActiveCustomerId(custId);
              } else {
                const existing = customers.find((c) => c.noWa === wa.trim());
                if (existing) {
                  setActiveCustomerId(existing.id);
                } else {
                  const newId = `CUST-00${customers.length + 1}`;
                  setCustomers((prev) => [
                    ...prev,
                    {
                      id: newId,
                      nama: nama.trim() || 'Pelanggan Baru',
                      noWa: wa.trim(),
                      alamat: '',
                      totalKunjungan: 0,
                      statusMember: 'Aktif',
                      riwayatBintang5Konsisten: true,
                      poinTerkumpul: 0,
                    },
                  ]);
                  setActiveCustomerId(newId);
                }
              }
              setCurrentRole('customer');
              setActiveTab('home');
              setIsLoggedIn(true);
            }}
            onLoginBarber={(barberId) => {
              setSelectedBarberId(barberId);
              setCurrentRole('barber');
              setActiveTab('manage');
              setIsLoggedIn(true);
            }}
            onLoginAdmin={() => {
              setCurrentRole('admin');
              setActiveTab('manage');
              setIsLoggedIn(true);
            }}
            onOpenCareer={() => {
              setCurrentRole('customer');
              setActiveTab('manage');
              setIsLoggedIn(true);
            }}
          />
        );
      }

      const lowStockCount = stok.filter((s) => s.stokSaatIni <= s.minimumStok).length;
      const pendingBookingCount = bookings.filter((b) => b.status === 'Menunggu').length;
      const currentBarberObj = barbers.find((b) => b.id === selectedBarberId) || barbers[0];

      return (
        <div className="min-h-screen bg-[#041a18] text-slate-100 flex justify-center">
          <div className="w-full max-w-md min-h-screen bg-[#062320] border-x border-white/10 flex flex-col relative shadow-2xl">
            {/* TOP HEADER */}
            <header className="sticky top-0 z-40 w-full bg-[#062320]/95 backdrop-blur-md border-b border-white/10 px-4 h-14 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-[#0b322c] border border-[#e5a93c]/30 flex items-center justify-center text-[#e5a93c]">
                  <ScissorsSvg className="w-4 h-4" />
                </div>
                <span className="font-bold text-base tracking-tight text-white">
                  Salon<span className="text-[#e5a93c]">CukurKilat</span>
                </span>
              </div>

              <div className="flex items-center gap-2">
                {gasSyncStatus === 'connected' && (
                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                    ● Sheets Aktif
                  </span>
                )}
                {gasSyncStatus === 'syncing' && (
                  <span className="text-[10px] font-bold text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded-full">
                    ↻ Sync...
                  </span>
                )}
                <button
                  onClick={() => setIsRoleModalOpen(true)}
                  className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-[#e5a93c]/30 bg-[#e5a93c]/10 text-[#e5a93c] text-xs font-semibold active:scale-95"
                >
                  <span className="truncate max-w-[100px]">
                    {currentRole === 'admin'
                      ? 'Admin (Owner)'
                      : currentRole === 'barber'
                      ? currentBarberObj.nickname
                      : activeCustomer.nama.split(' ')[0]}
                  </span>
                  <span className="text-[10px]">▼</span>
                </button>
              </div>
            </header>

            {/* MAIN CONTENT */}
            <main className="flex-1 px-4 pt-4 pb-24">
              {activeTab === 'home' && (
                <HomeSection
                  services={services}
                  barbers={barbers}
                  riwayatPotong={riwayatPotong}
                  activeCustomer={activeCustomer}
                  loyaltySettings={loyaltySettings}
                  onNavigateToBooking={(srvId, sType) => {
                    if (srvId) setPreselectedServiceId(srvId);
                    if (sType) setPreselectedServiceType(sType);
                    setActiveTab('booking');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }}
                  onNavigateToMember={() => {
                    setActiveTab('member');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }}
                />
              )}

              {activeTab === 'booking' && (
                <BookingSection
                  services={services}
                  barbers={barbers}
                  bookings={bookings}
                  activeCustomer={activeCustomer}
                  initialServiceId={preselectedServiceId}
                  initialServiceType={preselectedServiceType}
                  onCreateBooking={createBooking}
                  onBookingSuccess={() => setActiveTab('home')}
                />
              )}

              {activeTab === 'member' && (
                <MemberSection
                  activeCustomer={activeCustomer}
                  customers={customers}
                  setActiveCustomerId={setActiveCustomerId}
                  riwayatPotong={riwayatPotong}
                  loyaltySettings={loyaltySettings}
                  onSubmitReview={(id, rating, review) => {
                    setRiwayatPotong((prev) =>
                      prev.map((r) => (r.id === id ? { ...r, rating, review } : r))
                    );
                    dispatchToGas('submitReview', { id, rating, review });
                  }}
                />
              )}

              {activeTab === 'manage' && (
                <ManageSection
                  currentRole={currentRole}
                  selectedBarberId={selectedBarberId}
                  barbers={barbers}
                  bookings={bookings}
                  updateBookingStatus={updateBookingStatus}
                  pembayaran={pembayaran}
                  processPayment={processPayment}
                  stok={stok}
                  onUpdateStock={(id, delta) => {
                    setStok((prev) =>
                      prev.map((s) =>
                        s.id === id ? { ...s, stokSaatIni: Math.max(0, s.stokSaatIni + delta) } : s
                      )
                    );
                    dispatchToGas('updateStock', { id, delta });
                  }}
                  pendaftaran={pendaftaran}
                  onSubmitJobApplication={(data) => {
                    const id = `PEL-${Date.now().toString().slice(-4)}`;
                    setPendaftaran((prev) => [
                      {
                        ...data,
                        id,
                        statusLamaran: 'Baru',
                        tanggalDaftar: new Date().toISOString().slice(0, 10),
                      },
                      ...prev,
                    ]);
                    dispatchToGas('applyJob', data);
                  }}
                  onUpdateApplicantStatus={(id, status) => {
                    setPendaftaran((prev) =>
                      prev.map((a) => (a.id === id ? { ...a, statusLamaran: status } : a))
                    );
                    if (status === 'Diterima') {
                      const app = pendaftaran.find((a) => a.id === id);
                      if (app) {
                        setBarbers((prev) => [
                          ...prev,
                          {
                            id: `BRB-0${prev.length + 1}`,
                            nama: app.nama,
                            nickname: app.nama.split(' ')[0],
                            noWa: app.noWa,
                            spesialisasi: app.spesialisasi,
                            status: 'Aktif',
                            persentaseKomisi: 40,
                            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=400&q=80',
                            rating: 5.0,
                            totalPotong: 0,
                            jamMulai: '10:00',
                            jamSelesai: '21:00',
                          },
                        ]);
                      }
                    }
                    dispatchToGas('updateApplicantStatus', { id, status });
                  }}
                  riwayatPotong={riwayatPotong}
                  onAddRiwayatPotong={(item) => {
                    const newId = `RWY-${Date.now().toString().slice(-4)}`;
                    setRiwayatPotong((prev) => [{ ...item, id: newId }, ...prev]);
                    dispatchToGas('addRiwayatPotong', item);
                  }}
                  onToggleGaleri={(id) => {
                    setRiwayatPotong((prev) =>
                      prev.map((r) =>
                        r.id === id ? { ...r, tampilkanDiGaleri: !r.tampilkanDiGaleri } : r
                      )
                    );
                    dispatchToGas('toggleGaleri', { id });
                  }}
                  loyaltySettings={loyaltySettings}
                  onUpdateLoyalty={(newSettings) => {
                    setLoyaltySettings(newSettings);
                    dispatchToGas('updateLoyalty', newSettings);
                  }}
                  onRefreshSheets={loadFromGoogleSheets}
                />
              )}
            </main>

            {/* FLOATING PWA INSTALL PILL */}
            <PwaInstallBar hasBottomNav={true} />

            {/* BOTTOM NAVIGATION TAB BAR */}
            <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#062320]/95 backdrop-blur-lg border-t border-white/10">
              <div className="max-w-md mx-auto grid grid-cols-4 items-center h-16 px-1">
                {[
                  { id: 'home', label: 'Beranda', icon: '🏠' },
                  {
                    id: 'booking',
                    label: 'Booking',
                    icon: '📅',
                    badge: currentRole === 'admin' ? pendingBookingCount : 0,
                  },
                  { id: 'member', label: 'Member & Gaya', icon: '⭐' },
                  {
                    id: 'manage',
                    label:
                      currentRole === 'admin'
                        ? 'Kelola Salon'
                        : currentRole === 'barber'
                        ? 'Jadwal Barber'
                        : 'Karir Barber',
                    icon: '⚙️',
                    badge: currentRole === 'admin' ? lowStockCount : 0,
                  },
                ].map((tab) => {
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`relative flex flex-col items-center justify-center h-full min-h-[44px] py-1 transition-all ${
                        isActive ? 'text-[#e5a93c] font-bold' : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <div className="relative text-base">
                        <span>{tab.icon}</span>
                        {tab.badge > 0 && (
                          <span className="absolute -top-1 -right-3 bg-amber-500 text-slate-950 font-bold text-[9px] px-1.5 rounded-full">
                            {tab.badge}
                          </span>
                        )}
                      </div>
                      <span className="text-[10px] tracking-tight mt-0.5 truncate max-w-[80px]">
                        {tab.label}
                      </span>
                    </button>
                  );
                })}
              </div>
            </nav>

            {/* ROLE SWITCHER MODAL */}
            {isRoleModalOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm p-0 sm:p-4">
                <div className="w-full max-w-md bg-[#0b322c] border-t sm:border border-white/15 rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl text-slate-100 space-y-3">
                  <div className="flex items-center justify-between pb-2 border-b border-white/10">
                    <div>
                      <h3 className="font-bold text-base text-white">Ganti Peran / Akun</h3>
                      <p className="text-xs text-slate-400">Uji coba cepat RBAC atau keluar</p>
                    </div>
                    <button
                      onClick={() => setIsRoleModalOpen(false)}
                      className="px-2.5 py-1 rounded-lg bg-white/10 text-xs"
                    >
                      ✕
                    </button>
                  </div>

                  <button
                    onClick={() => {
                      setCurrentRole('customer');
                      setIsRoleModalOpen(false);
                    }}
                    className={`w-full text-left p-3 rounded-xl border ${
                      currentRole === 'customer'
                        ? 'border-[#e5a93c] bg-[#e5a93c]/10'
                        : 'border-white/10 bg-[#062320]/60'
                    }`}
                  >
                    <div className="font-bold text-xs text-white">👤 Pelanggan / Member</div>
                    <div className="text-[11px] text-slate-400">
                      Booking cukur, cek kartu member ({activeCustomer.totalKunjungan}/15), riwayat & review.
                    </div>
                  </button>

                  <div className="p-3 rounded-xl border border-white/10 bg-[#062320]/60 space-y-2">
                    <div className="font-bold text-xs text-white">✂️ Pilih Kapster (Mode Barber):</div>
                    <div className="grid grid-cols-3 gap-1.5">
                      {barbers.map((b) => (
                        <button
                          key={b.id}
                          onClick={() => {
                            setSelectedBarberId(b.id);
                            setCurrentRole('barber');
                            setActiveTab('manage');
                            setIsRoleModalOpen(false);
                          }}
                          className={`p-2 rounded-lg text-[11px] font-semibold border ${
                            currentRole === 'barber' && selectedBarberId === b.id
                              ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                              : 'bg-white/5 border-white/10 text-slate-300'
                          }`}
                        >
                          {b.nickname}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={() => {
                      setCurrentRole('admin');
                      setActiveTab('manage');
                      setIsRoleModalOpen(false);
                    }}
                    className={`w-full text-left p-3 rounded-xl border ${
                      currentRole === 'admin'
                        ? 'border-[#e5a93c] bg-[#e5a93c]/10'
                        : 'border-white/10 bg-[#062320]/60'
                    }`}
                  >
                    <div className="font-bold text-xs text-[#e5a93c]">🛡️ Owner / Admin (Superadmin)</div>
                    <div className="text-[11px] text-slate-400">
                      Laporan omset, komisi semua barber, stok pomade, pelamar kerja, & aturan loyalty.
                    </div>
                  </button>

                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      onClick={() => {
                        setIsRoleModalOpen(false);
                        setIsLoggedIn(false);
                      }}
                      className="py-2.5 rounded-xl bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs font-bold"
                    >
                      Keluar ke Login
                    </button>
                    <button
                      onClick={() => setIsRoleModalOpen(false)}
                      className="py-2.5 rounded-xl bg-white/10 text-slate-200 text-xs font-semibold"
                    >
                      Tutup
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4B. KOMPONEN FLOATING PWA INSTALL PILL & SMART BOTTOM SHEET
    // =========================================================================
    function PwaInstallBar({ hasBottomNav }) {
      const STORAGE_KEY = 'saloncukurkilat_pwa_installed_v1';
      const [isInstalled, setIsInstalled] = useState(false);
      const [isDismissed, setIsDismissed] = useState(false);
      const [isSheetOpen, setIsSheetOpen] = useState(false);
      const [platform, setPlatform] = useState('android');
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [justMarkedInstalled, setJustMarkedInstalled] = useState(false);

      useEffect(() => {
        const isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        const savedInstalled = localStorage.getItem(STORAGE_KEY) === 'true';

        if (isStandalone || savedInstalled) {
          setIsInstalled(true);
        }

        const ua = window.navigator.userAgent.toLowerCase();
        if (/iphone|ipad|ipod/.test(ua)) {
          setPlatform('ios');
        } else {
          setPlatform('android');
        }

        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };

        const handleAppInstalled = () => {
          localStorage.setItem(STORAGE_KEY, 'true');
          setIsInstalled(true);
          setIsSheetOpen(false);
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        window.addEventListener('appinstalled', handleAppInstalled);

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          window.removeEventListener('appinstalled', handleAppInstalled);
        };
      }, []);

      if (isInstalled || isDismissed) return null;

      const handlePillClick = async () => {
        if (deferredPrompt) {
          try {
            await deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            if (choice.outcome === 'accepted') {
              localStorage.setItem(STORAGE_KEY, 'true');
              setIsInstalled(true);
              setDeferredPrompt(null);
              return;
            }
          } catch (err) {
            // Lanjut buka Smart Bottom Sheet jika prompt gagal
          }
        }
        setIsSheetOpen(true);
      };

      const handleConfirmInstalled = () => {
        localStorage.setItem(STORAGE_KEY, 'true');
        setJustMarkedInstalled(true);
        setTimeout(() => {
          setIsSheetOpen(false);
          setIsInstalled(true);
        }, 900);
      };

      return (
        <>
          {/* FLOATING BOTTOM PILL / ACTION BAR (Area Jempol Mobile) */}
          <div
            className={`fixed left-0 right-0 z-30 pointer-events-none flex justify-center px-3 transition-all duration-300 ${
              hasBottomNav ? 'bottom-[72px]' : 'bottom-4'
            }`}
          >
            <div className="w-full max-w-md flex items-center justify-between gap-2 pl-3.5 pr-2 py-2 rounded-full bg-gradient-to-r from-[#0b322c]/95 via-[#0f3f37]/95 to-[#0b322c]/95 backdrop-blur-md border border-[#e5a93c]/50 shadow-[0_10px_30px_rgba(0,0,0,0.65)] pointer-events-auto">
              <button
                type="button"
                onClick={handlePillClick}
                className="flex-1 flex items-center gap-2.5 text-left active:scale-[0.98] transition-transform"
              >
                <span className="relative flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#e5a93c] text-[#062320] text-xs font-extrabold shadow-sm">
                  📲
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#e5a93c] opacity-30"></span>
                </span>
                <div className="min-w-0 flex-1">
                  <div className="text-xs font-extrabold text-white tracking-tight truncate">
                    📲 Pasang Aplikasi <span className="text-[#e5a93c]">(Hanya 1 MB)</span>
                  </div>
                  <div className="text-[10px] text-slate-300 truncate">
                    Akses 1-klik di layar utama HP tanpa memori penuh
                  </div>
                </div>
              </button>

              <div className="flex items-center gap-1 shrink-0">
                <button
                  type="button"
                  onClick={handlePillClick}
                  className="px-3 py-1.5 rounded-full bg-[#e5a93c] hover:bg-[#f0b749] text-[#062320] font-extrabold text-[11px] shadow-sm active:scale-95 transition-all"
                >
                  Pasang
                </button>
                <button
                  type="button"
                  onClick={() => setIsDismissed(true)}
                  aria-label="Sembunyikan tombol pasang"
                  className="p-1.5 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-colors text-xs leading-none"
                >
                  ✕
                </button>
              </div>
            </div>
          </div>

          {/* SMART INSTALL BOTTOM SHEET */}
          {isSheetOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm p-0 sm:p-4">

      const [roleTab, setRoleTab] = useState('customer');
      const [custPhone, setCustPhone] = useState('081398765432');

                        type="password"
                        required
                        value={barberPin}
                        onChange={(e) => setBarberPin(e.target.value)}
                        className="w-full bg-[#062320] border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white font-mono"
                      />
                    </div>
                  </div>
                )}

                {roleTab === 'admin' && (
                  <div className="space-y-3">
                    <div>
                      <h2 className="text-sm font-bold text-white">Dashboard Pemilik (Superadmin)</h2>

            {/* FLOATING PWA INSTALL PILL DI LOGIN */}
            <PwaInstallBar hasBottomNav={false} />

      );

    // =========================================================================
    // 7. KOMPONEN BOOKING (ANTI-BENTROK)
    // =========================================================================
    function BookingSection({ services, barbers, bookings, activeCustomer, initialServiceId, initialServiceType, onCreateBooking, onBookingSuccess }) {
      const [serviceType, setServiceType] = useState(initialServiceType || 'Studio');
      const [selectedServiceId, setSelectedServiceId] = useState(initialServiceId || services[0].id);
      const [selectedBarberId, setSelectedBarberId] = useState(barbers[0].id);
      const todayStr = new Date().toISOString().slice(0, 10);
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedTimeSlot, setSelectedTimeSlot] = useState('09:00');
      const [customerName, setCustomerName] = useState(activeCustomer.nama);
      const [customerPhone, setCustomerPhone] = useState(activeCustomer.noWa);
      const [homeAddress, setHomeAddress] = useState(activeCustomer.alamat || '');
      const [specialNotes, setSpecialNotes] = useState('');
      const [bookingResult, setBookingResult] = useState(null);

      const selectedService = services.find((s) => s.id === selectedServiceId) || services[0];
      const selectedBarber = barbers.find((b) => b.id === selectedBarberId) || barbers[0];
      const currentPrice = serviceType === 'Studio' ? selectedService.priceStudio : selectedService.priceHomeService;

      const timeSlots = ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:30', '17:30', '19:00', '20:00'];

      const isSlotBooked = (time) =>
        bookings.some(
          (b) =>
            b.kapsterId === selectedBarberId &&
            b.tanggal === selectedDate &&
            b.jam === time &&
            b.status !== 'Batal'
        );

      const handleSubmit = (e) => {
        e.preventDefault();
        if (serviceType === 'Home Service' && !homeAddress.trim()) {
          return setBookingResult({ success: false, message: 'Layanan Home Service wajib mengisi alamat lengkap.' });
        }
        const res = onCreateBooking({
          pelangganId: activeCustomer.id,
          pelangganNama: customerName.trim(),
          pelangganWa: customerPhone.trim(),
          jenisLayanan: serviceType,
          alamatHomeService: serviceType === 'Home Service' ? homeAddress.trim() : '',
          tanggal: selectedDate,
          jam: selectedTimeSlot,
          layananId: selectedService.id,
          layananNama: selectedService.name,
          biaya: currentPrice,
          kapsterId: selectedBarber.id,
          kapsterNama: selectedBarber.nickname,
          catatanKhusus: specialNotes.trim(),
        });
        setBookingResult(res);
      };

      if (bookingResult && bookingResult.success) {
        const waMsg = `Halo SalonCukurKilat! Saya telah melakukan booking *${bookingResult.bookingId}*:\nNama: *${customerName}*\nLayanan: *${selectedService.name}* (${serviceType})\nKapster: *${selectedBarber.nickname}*\nJadwal: *${formatTanggalIndonesia(selectedDate)} jam ${selectedTimeSlot}*`;
        return (
          <div className="bg-[#0b322c] border border-emerald-500/40 rounded-2xl p-5 text-center space-y-4">
            <div className="text-4xl">✅</div>
            <h2 className="text-lg font-bold text-white">Booking Berhasil ({bookingResult.bookingId})</h2>
            <p className="text-xs text-slate-300">{bookingResult.message}</p>
            <div className="bg-black/30 rounded-xl p-3.5 text-left text-xs space-y-1.5">
              <div className="flex justify-between"><span className="text-slate-400">Layanan:</span><span className="font-bold text-white">{selectedService.name}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">Tipe:</span><span className="font-bold text-[#e5a93c]">{serviceType}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">Kapster:</span><span className="font-bold text-white">{selectedBarber.nickname}</span></div>
              <div className="flex justify-between"><span className="text-slate-400">Waktu:</span><span className="font-bold text-white">{selectedDate} · {selectedTimeSlot}</span></div>
              <div className="flex justify-between border-t border-white/10 pt-1.5"><span className="text-slate-400">Biaya:</span><span className="font-bold text-[#e5a93c] font-mono">{formatRupiah(currentPrice)}</span></div>
            </div>
            <a
              href={`https://wa.me/6281234567890?text=${encodeURIComponent(waMsg)}`}
              target="_blank"
              rel="noreferrer"
              className="block w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-xs"
            >
              📲 Konfirmasi via WhatsApp Sekarang
            </a>
            <button onClick={onBookingSuccess} className="w-full py-2.5 rounded-xl bg-white/10 text-xs font-semibold">
              Kembali ke Beranda
            </button>
          </div>
        );
      }

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <h1 className="text-xl font-bold text-white">✂️ Booking Jadwal Cukur</h1>
          {bookingResult && !bookingResult.success && (
            <div className="bg-rose-950/70 border border-rose-500/40 rounded-xl p-3 text-xs text-rose-200">
              {bookingResult.message}
            </div>
          )}

          {/* Tempat Layanan */}
          <div className="grid grid-cols-2 gap-2 p-1 bg-[#0b322c] rounded-xl border border-white/10">
            {['Studio', 'Home Service'].map((t) => (
              <button
                key={t}
                type="button"
                onClick={() => setServiceType(t)}
                className={`py-2.5 rounded-lg text-xs font-bold ${
                  serviceType === t ? 'bg-[#e5a93c] text-[#062320]' : 'text-slate-300'
                }`}
              >
                {t === 'Studio' ? '✂️ Di Studio Salon' : '📍 Home Service'}
              </button>
            ))}
          </div>

          {/* Paket */}
          <div className="space-y-1.5">
            <label className="text-xs font-bold text-slate-200">Pilih Layanan:</label>
            {services.map((srv) => {
              const price = serviceType === 'Studio' ? srv.priceStudio : srv.priceHomeService;
              return (
                <div
                  key={srv.id}
                  onClick={() => setSelectedServiceId(srv.id)}
                  className={`p-3 rounded-xl border cursor-pointer flex justify-between items-center ${
                    selectedServiceId === srv.id ? 'border-[#e5a93c] bg-[#e5a93c]/10' : 'border-white/10 bg-[#0b322c]'
                  }`}
                >
                  <span className="text-xs font-semibold text-white">{srv.name}</span>
                  <span className="text-xs font-bold text-[#e5a93c] font-mono">{formatRupiah(price)}</span>
                </div>
              );
            })}
          </div>

          {/* Kapster */}
          <div className="space-y-1.5">
            <label className="text-xs font-bold text-slate-200">Pilih Kapster:</label>
            <div className="grid grid-cols-3 gap-2">
              {barbers.map((b) => (
                <button
                  key={b.id}
                  type="button"
                  onClick={() => setSelectedBarberId(b.id)}
                  className={`p-2.5 rounded-xl border text-center ${
                    selectedBarberId === b.id ? 'border-[#e5a93c] bg-[#e5a93c]/15 text-white' : 'border-white/10 bg-[#0b322c] text-slate-300'
                  }`}
                >
                  <div className="font-bold text-[11px] truncate">{b.nickname}</div>
                  <div className="text-[10px] text-[#e5a93c]">★ {b.rating}</div>
                </button>
              ))}
            </div>
          </div>

          {/* Tanggal & Jam */}
          <div className="space-y-2">
            <div className="flex justify-between items-center">
              <label className="text-xs font-bold text-slate-200">Tanggal & Jam (Anti-Bentrok):</label>
              <input
                type="date"
                value={selectedDate}
                onChange={(e) => setSelectedDate(e.target.value)}
                className="bg-[#0b322c] border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-white"
              />
            </div>
            <div className="grid grid-cols-5 gap-1.5">
              {timeSlots.map((time) => {
                const booked = isSlotBooked(time);
                return (
                  <button
                    key={time}
                    type="button"
                    disabled={booked}
                    onClick={() => setSelectedTimeSlot(time)}
                    className={`py-2 rounded-lg text-xs font-mono font-medium ${
                      booked
                        ? 'bg-rose-950/40 text-rose-400/50 line-through cursor-not-allowed border border-rose-900/40'
                        : selectedTimeSlot === time
                        ? 'bg-[#e5a93c] text-[#062320] font-bold'
                        : 'bg-[#0b322c] text-slate-200 border border-white/10'
                    }`}
                  >
                    {time}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Data Pelanggan */}
          <div className="bg-[#0b322c] p-3.5 rounded-xl border border-white/10 space-y-2.5">
            <input
              type="text"
              required
              value={customerName}
              onChange={(e) => setCustomerName(e.target.value)}
              placeholder="Nama Lengkap"
              className="w-full bg-[#062320] border border-white/10 rounded-lg px-3 py-2 text-xs text-white"
            />
            <input
              type="tel"
              required
              value={customerPhone}
              onChange={(e) => setCustomerPhone(e.target.value)}
              placeholder="Nomor WhatsApp"
              className="w-full bg-[#062320] border border-white/10 rounded-lg px-3 py-2 text-xs text-white"
            />
            {serviceType === 'Home Service' && (
              <textarea
                required
                rows={2}
                value={homeAddress}
                onChange={(e) => setHomeAddress(e.target.value)}
                placeholder="Alamat Lengkap Home Service & Patokan Lokasi..."
                className="w-full bg-[#062320] border border-white/10 rounded-lg px-3 py-2 text-xs text-white"
              />
            )}
            <input
              type="text"
              value={specialNotes}
              onChange={(e) => setSpecialNotes(e.target.value)}
              placeholder="Catatan Gaya Rambut (Opsional)"
              className="w-full bg-[#062320] border border-white/10 rounded-lg px-3 py-2 text-xs text-white"
            />
          </div>

          <div className="bg-[#0b322c] border border-[#e5a93c]/30 rounded-xl p-4 flex items-center justify-between">
            <div>
              <div className="text-[10px] text-slate-400">Total Biaya</div>
              <div className="text-lg font-bold text-[#e5a93c] font-mono">{formatRupiah(currentPrice)}</div>
            </div>
            <button type="submit" className="py-3 px-6 rounded-xl bg-[#e5a93c] text-[#062320] font-bold text-xs shadow-lg">
              Booking Sekarang →
            </button>
          </div>
        </form>
      );
    }

    // =========================================================================
    // 8. KOMPONEN MEMBER & RIWAYAT GAYA
    // =========================================================================
    function MemberSection({ activeCustomer, customers, setActiveCustomerId, riwayatPotong, loyaltySettings, onSubmitReview }) {
      const [reviewingId, setReviewingId] = useState(null);
      const [ratingInput, setRatingInput] = useState(5);
      const [reviewText, setReviewText] = useState('');

      const targetVisits = loyaltySettings.jumlahKunjunganReward || 15;
      const currentVisits = activeCustomer.totalKunjungan || 0;
      const isRewardUnlocked = currentVisits >= targetVisits && activeCustomer.riwayatBintang5Konsisten;

      const myHistories = riwayatPotong.filter(
        (r) =>
          r.pelangganId === activeCustomer.id ||
          r.pelangganNama.toLowerCase().includes(activeCustomer.nama.toLowerCase().split(' ')[0])
      );

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold text-white">⭐ Member & Riwayat</h1>
              <p className="text-xs text-slate-300">Kartu stempel loyalitas & catatan gaya rambut</p>
            </div>
            <select
              value={activeCustomer.id}
              onChange={(e) => setActiveCustomerId(e.target.value)}
              className="bg-[#0b322c] border border-white/10 rounded-lg px-2 py-1 text-xs text-[#e5a93c] font-bold"
            >
              {customers.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.nama} ({c.totalKunjungan}x)
                </option>
              ))}
            </select>
          </div>

          {/* 15 Stamp Card */}
          <div className="rounded-2xl bg-gradient-to-br from-[#0c3832] via-[#092c27] to-[#051c19] border border-[#e5a93c]/40 p-4 shadow-xl space-y-3">
            <div className="flex justify-between items-start border-b border-white/10 pb-2.5">
              <div>
                <div className="text-[10px] font-bold text-[#e5a93c] uppercase">Kartu Member SalonCukurKilat</div>
                <div className="text-base font-bold text-white">{activeCustomer.nama}</div>
                <div className="text-[11px] text-slate-300">{activeCustomer.noWa}</div>
              </div>
              <div className="text-right">
                <div className="text-[10px] text-slate-400">Total Kunjungan</div>
                <div className="text-xl font-bold font-mono text-[#e5a93c]">
                  {currentVisits} / {targetVisits}
                </div>
              </div>
            </div>

            <div className="grid grid-cols-5 gap-2">
              {[...Array(targetVisits)].map((_, i) => {
                const slot = i + 1;
                const stamped = slot <= currentVisits;
                const isLast = slot === targetVisits;
                return (
                  <div
                    key={slot}
                    className={`aspect-square rounded-xl flex flex-col items-center justify-center p-1 text-center ${
                      isLast
                        ? stamped
                          ? 'bg-[#e5a93c] text-slate-950 font-black'
                          : 'border-2 border-dashed border-[#e5a93c] text-[#e5a93c]'
                        : stamped
                        ? 'bg-[#e5a93c]/20 border border-[#e5a93c]/60 text-[#e5a93c]'
                        : 'bg-black/25 border border-white/5 text-slate-600'
                    }`}
                  >
                    <span className="text-xs font-bold font-mono">{isLast ? '🎁' : stamped ? '✂️' : slot}</span>
                    <span className="text-[9px] font-mono">{isLast ? 'GRATIS' : `#${slot}`}</span>
                  </div>
                );
              })}
            </div>

            {isRewardUnlocked && (
              <div className="p-3 rounded-xl bg-emerald-950/70 border border-emerald-500/50 text-xs text-emerald-200 font-semibold">
                🎉 Selamat! Kupon 1x Potong Rambut Gratis Anda sudah aktif. Tunjukkan kartu ini ke kapster!
              </div>
            )}
          </div>

          {/* History List */}
          <div className="space-y-3">
            <h2 className="text-sm font-bold text-white">✂️ Riwayat Gaya & Catatan Barber</h2>
            {myHistories.map((item) => (
              <div key={item.id} className="bg-[#0b322c] border border-white/10 rounded-xl p-3.5 space-y-2.5">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <div className="font-bold text-xs text-white">{item.modelPotongan}</div>
                    <div className="text-[10px] text-slate-400">
                      Oleh {item.barberNama} · {formatTanggalIndonesia(item.tanggal)}
                    </div>
                    <div className="text-xs text-[#e5a93c] mt-1">{'★'.repeat(Number(item.rating) || 5)}</div>
                  </div>
                  <button
                    onClick={() => {
                      setReviewingId(item.id);
                      setRatingInput(item.rating || 5);
                      setReviewText(item.review || '');
                    }}
                    className="px-2.5 py-1.5 rounded-lg bg-white/10 text-[#e5a93c] text-xs font-semibold"
                  >
                    Ulasan
                  </button>
                </div>
                <div className="bg-black/30 rounded-lg p-2.5 text-[11px] text-slate-200 italic">
                  ✂️ Catatan Barber: "{item.catatanGaya}"
                </div>
                {item.review && (
                  <div className="text-[11px] text-slate-300">
                    <span className="text-[#e5a93c] font-semibold">Ulasan Anda:</span> "{item.review}"
                  </div>
                )}
              </div>
            ))}
          </div>

          {reviewingId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  onSubmitReview(reviewingId, ratingInput, reviewText);
                  setReviewingId(null);
                }}
                className="w-full max-w-sm bg-[#0b322c] border border-white/20 rounded-2xl p-5 space-y-3"
              >
                <h3 className="font-bold text-sm text-white">Beri Rating & Review</h3>
                <div className="flex justify-center gap-2 py-2">
                  {[1, 2, 3, 4, 5].map((s) => (
                    <button
                      key={s}
                      type="button"
                      onClick={() => setRatingInput(s)}
                      className={`text-2xl ${s <= ratingInput ? 'text-[#e5a93c]' : 'text-slate-600'}`}
                    >
                      ★
                    </button>
                  ))}
                </div>
                <textarea
                  required
                  rows={3}
                  value={reviewText}
                  onChange={(e) => setReviewText(e.target.value)}
                  placeholder="Tulis pengalaman cukur Anda..."
                  className="w-full bg-[#062320] border border-white/10 rounded-xl p-2.5 text-xs text-white"
                />
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setReviewingId(null)}
                    className="flex-1 py-2 rounded-xl bg-white/10 text-xs"
                  >
                    Batal
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 rounded-xl bg-[#e5a93c] text-[#062320] font-bold text-xs"
                  >
                    Simpan
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }
